<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — choose a time</title>
<meta http-equiv="refresh" content="2;url=https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ03QzsP3WXN_aZiJrDh9gtPuNexFHCiZKXVCnHtiPdj3xbgdP642Gv2UKXUE5iytPxg75rm1dUY?gv=true">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:Arial,Helvetica,sans-serif;color:#eef3fb;
       background:radial-gradient(900px 420px at 50% -10%,#0e2a45,#070b12);padding:32px 22px}
  .card{background:rgba(11,18,32,.85);border:1px solid rgba(255,255,255,.10);border-radius:18px;
        box-shadow:0 24px 60px rgba(0,0,0,.5);max-width:460px;width:100%;padding:40px 32px;
        text-align:center;backdrop-filter:blur(12px)}
  .tick{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;
        background:linear-gradient(135deg,#34d399,#059669);display:flex;align-items:center;justify-content:center;
        box-shadow:0 8px 20px rgba(52,211,153,.35)}
  .tick svg{width:28px;height:28px;fill:#fff}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#93a3ba;font-size:15px;line-height:1.6;margin:0 0 22px}
  .cd{font-weight:700;color:#38bdf8}
  a.btn{display:inline-block;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#04121f;
        padding:15px 30px;border-radius:10px;text-decoration:none;font-size:15px;font-weight:700;
        box-shadow:0 8px 20px rgba(56,189,248,.32)}
  .note{font-size:12px;color:#5c6b82;margin-top:20px}
</style>
</head>
<body>
  <div class="card">
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
    <h1>Details received — thank you</h1>
    <p>Taking you to my calendar in <span class="cd" id="cd">2</span> seconds so you can pick a time.</p>
    <a class="btn" href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ03QzsP3WXN_aZiJrDh9gtPuNexFHCiZKXVCnHtiPdj3xbgdP642Gv2UKXUE5iytPxg75rm1dUY?gv=true">Choose a time now →</a>
    <p class="note">If nothing happens, tap the button above.</p>
  </div>
  <script>
    var t="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ03QzsP3WXN_aZiJrDh9gtPuNexFHCiZKXVCnHtiPdj3xbgdP642Gv2UKXUE5iytPxg75rm1dUY?gv=true",n=2,el=document.getElementById('cd');
    var i=setInterval(function(){n--;if(n<1){clearInterval(i);location.href=t}else{el.textContent=n}},1000);
    window.addEventListener('load',function(){setTimeout(function(){location.replace(t)},2200)});
  </script>
</body>
</html>
